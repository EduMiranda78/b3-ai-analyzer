<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Analisador de Mercado IA</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="hero">

        <div class="logo-badge">
            📈 Analisador de Mercado IA
        </div>

        <h1>
            Análise Profissional de Ativos
        </h1>

        <p class="subtitle">
            Indicadores técnicos, análise quantitativa e inteligência artificial.
        </p>


        <a
            href="/historico"
            class="history-home-link"
        >
            Ver histórico de análises
        </a>

        <form action="/gerar_relatorio" method="POST" id="formAnalise">

            <div class="quick-buttons">

                <button type="button" onclick="setTicker('PETR4')">PETR4</button>
                <button type="button" onclick="setTicker('VALE3')">VALE3</button>
                <button type="button" onclick="setTicker('ITUB4')">ITUB4</button>
                <button type="button" onclick="setTicker('BBAS3')">BBAS3</button>

            </div>

            <input id="ticker" name="ticker" type="text" placeholder="Digite um ticker (PETR4, VALE3, ITUB4...)"
                required>

            <button class="btn-primary" type="submit">
                Gerar Relatório
            </button>

        </form>

        <div id="loading" class="loading hidden">

            <div class="spinner"></div>

            <p>
                Coletando dados de mercado e processando análise...
            </p>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>

</html>
